limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = / { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location ~* ^/(app\.js|styles\.css)$ { try_files $uri =404; add_header Cache-Control 'no-cache'; }
    location = /api/auth/login { limit_req zone=auth_limit burst=5 nodelay; rewrite ^/api/(.*)$ /$1 break; proxy_pass http://api:8000; }
    location = /api/auth/register { limit_req zone=auth_limit burst=5 nodelay; rewrite ^/api/(.*)$ /$1 break; proxy_pass http://api:8000; }
    location = /api/auth/refresh { limit_req zone=auth_limit burst=5 nodelay; rewrite ^/api/(.*)$ /$1 break; proxy_pass http://api:8000; }
    location = /api/retailers/apply { limit_req zone=auth_limit burst=5 nodelay; rewrite ^/api/(.*)$ /$1 break; proxy_pass http://api:8000; }
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000;
    }
    location / { return 404; }
}
