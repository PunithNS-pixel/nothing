# Google Compute Engine single-VM HTTPS DEMO (NOT a hardened production deployment).
# From the repository root: sudo docker compose -f backend/compose.gce.yml --env-file backend/.env up -d --build
# Only Caddy exposes host ports. All stateful brokers and databases stay private on the Compose network.
name: nothing-gce
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nothing
      POSTGRES_USER: nothing
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set a strong LOCAL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nothing -d nothing"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes:
      - searchdata:/usr/share/opensearch/data

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nothing
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq

  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
      - "8081"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/nothing
      DATABASE_USER: nothing
      DATABASE_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD}
      HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_COOKIE_SECURE: "true"
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in private backend env}
      IMAGE_BASE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN}/images
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RETAILER_DISCOUNT_PERCENT: ${RETAILER_DISCOUNT_PERCENT:-10}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: nothing
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      OPENSEARCH_URL: http://opensearch:9200
      SEED_COFFEE_CATALOG: "false"
      SEED_RETAIL_CATALOG: ${SEED_RETAIL_CATALOG:-true}
      SEED_OFFERS: ${SEED_OFFERS:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:?Set STRIPE_SUCCESS_URL in private backend env}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:?Set STRIPE_CANCEL_URL in private backend env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:-}
      MAIL_NOTIFICATIONS_ENABLED: ${MAIL_NOTIFICATIONS_ENABLED:-false}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-5000}
      MAIL_HEALTH_ENABLED: "false"
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      opensearch: {condition: service_started}
      rabbitmq: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health/liveness"]
      interval: 12s
      timeout: 5s
      retries: 6
      start_period: 90s

  frontend:
    image: nginx:1.28-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ../nothing-coffee:/usr/share/nginx/html:ro
      - ./nginx.gce.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.gce:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      frontend: {condition: service_started}

volumes:
  pgdata:
  searchdata:
  rabbitdata:
  caddydata:
  caddyconfig:
