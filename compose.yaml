name: retail-platform
x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    kafka: {condition: service_healthy}
    opensearch: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U store -d store'], interval: 5s, retries: 30}
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ['127.0.0.1:9092:9092']
    healthcheck: {test: ['CMD-SHELL','/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1'], interval: 10s, retries: 30, start_period: 20s}
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [searchdata:/usr/share/opensearch/data]
    ports: ['127.0.0.1:9200:9200']
    healthcheck: {test: ['CMD-SHELL','curl -fsS http://localhost:9200/_cluster/health >/dev/null'], interval: 10s, retries: 40, start_period: 30s}
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ['127.0.0.1:15672:15672']
    healthcheck: {test: ['CMD','rabbitmq-diagnostics','-q','ping'], interval: 10s, retries: 30}
  migrate:
    <<: *app
    restart: 'no'
    command: ['alembic','upgrade','head']
  api:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck: {test: ['CMD','python','-c','import urllib.request; urllib.request.urlopen("http://localhost:8000/health/live")'], interval: 15s, retries: 5}
  outbox:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ['python','-m','workers.outbox']
  consumer:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ['python','-m','workers.consumer']
  notifications:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ['python','-m','workers.notifications']
  gateway:
    image: nginx:1.27-alpine
    volumes: ['./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro','./web:/usr/share/nginx/html:ro']
    ports: ['${WEB_BIND:-127.0.0.1}:8080:8080']
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ['./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro',promdata:/prometheus]
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
    volumes: ['./infra/grafana/provisioning:/etc/grafana/provisioning:ro',grafanadata:/var/lib/grafana]
    ports: ['127.0.0.1:3001:3000']
volumes:
  pgdata:
  searchdata:
  promdata:
  grafanadata:
