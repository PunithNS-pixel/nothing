name: Backend CI
on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package and tests
        working-directory: backend
        run: mvn -B clean verify
