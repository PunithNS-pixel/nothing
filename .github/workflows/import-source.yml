name: Import integrated full-stack source
on:
  push:
    branches: [feat/nothing-coffee-fullstack]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete source archive into Git working tree
        run: python3 bootstrap.py
      - name: Commit imported files to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: expand integrated Nothing Coffee full-stack source"
            git push origin HEAD:feat/nothing-coffee-fullstack
          fi
