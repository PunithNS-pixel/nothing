name: Backend checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app workers scripts
      - run: PYTHONPATH=. python -m pytest -q

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check web/app.js
      - run: bash -n scripts/demo.sh scripts/verify.sh
      - run: python -c "import yaml; [yaml.safe_load(open(p)) for p in ('compose.yaml','compose.aiven.yaml')]"
