name: One-time approved obsolete-branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-obsolete-branches-once.yml
permissions:
  contents: write
jobs:
  delete-obsolete-branches:
    if: github.repository == 'PunithNS-pixel/nothing'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only explicitly identified, unchanged obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$CURRENT_SHA"
          final_sha="$(gh api "repos/$GH_REPO/git/ref/heads/final" --jq '.object.sha')"
          case "$final_sha" in
            "d4af02015b62a96ab711d8f97b58dbdcc37c2f2e" | "$CURRENT_SHA") ;;
            *) echo "FAIL: final ref unexpectedly changed"; exit 1 ;;
          esac
          # The exact branches + SHA values were inspected before this job was created.
          # Do NOT delete any ref that has moved in the meantime.
          while IFS=' ' read -r branch expected; do
            test -n "$branch" || continue
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$actual" ]; then
              echo "ALREADY ABSENT: $branch"
              continue
            fi
            if [ "$actual" != "$expected" ]; then
              echo "SKIPPED: $branch has a new commit, not deleting"
              continue
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "DELETED: $branch"
          done <<'BRANCHES'
          backend 3539c749a378db3f2d77f16ea878b689c5f471a7
          database 72d106386f094505bc68a98650ddbc079df9f478
          feat/nothing b52b498291ece8c683efa6b88e0832d7466353cc
          feat/nothing-coffee-fullstack 3bf06d2e62612f6562069966cc4c21ef1cf6b280
          feat/nothing-editorial-sage-storefront 25f23c47baf2417712dad4af3d239b5fc744ba61
          feat/nothing-frontend-correct-base b52b498291ece8c683efa6b88e0832d7466353cc
          feat/nothing-marketplace aea6f51a33324968c7aea06f97ca399af81b4f45
          feat/nothing-marketplace-springboot 105a29a872128f770d7763f7c0709e9771a7d5e5
          fix/auth-and-product-gallery 45fd25ec987bfcc4951360bba8abe4b01ed17a88
          BRANCHES
          echo "One-time cleanup finished. main and final were never targeted."
